# Reusable nightly pg_dump — one implementation for the whole fleet (D1).
# Callers keep their own cron schedule + secret; this file owns the HOW:
# version-matched client, compressed custom-format dump, content guard
# (tables + rows), integrity check, artifact upload. Introduced by the
# 2026-08 fleet review (OPS-3/6).
# Every input except app_id has a default, so existing callers keep working.
name: DB Backup (reusable)

on:
  workflow_call:
    inputs:
      retention_days:
        description: Artifact retention in days (storage arithmetic in README)
        type: number
        default: 7
      app_id:
        description: Short app name used in the artifact name
        type: string
        required: true
      compression:
        description: pg_dump --compress spec for the custom-format dump
        type: string
        default: zstd:level=9,long
      min_tables:
        description: Fail when the dump holds fewer tables than this
        type: number
        default: 1
      min_rows:
        description: Fail when the dump holds fewer rows than this, not counting migration-bookkeeping tables
        type: number
        default: 1
    secrets:
      DATABASE_URL_DIRECT:
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install version-matched postgres client
        run: |
          # apt-key is gone from apt >= 3.0 — use signed-by keyring.
          CODENAME=$(lsb_release -cs)
          sudo sh -c "echo \"deb http://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main\" > /etc/apt/sources.list.d/pgdg.list"
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client-17
          # The package does NOT go on PATH — /usr/bin/pg_dump stays the
          # runner's older client and pg_dump refuses on version mismatch.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump
        run: |
          pg_dump --no-owner --no-privileges \
                  --format=custom \
                  --compress="$COMPRESSION" \
                  --file "dump.dump" \
                  "$DATABASE_URL_DIRECT"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          COMPRESSION: ${{ inputs.compression }}

      # A wiped database still dumps to tens or hundreds of KB (its schema is
      # all still there), so size proves nothing: count what is inside instead.
      # Reading every COPY block also decompresses every data block — a far
      # stronger integrity check than listing the table of contents.
      - name: Content guard + integrity check
        run: |
          set -euo pipefail
          pg_restore --list dump.dump > toc.txt
          tables=$(awk '$4 == "TABLE" && $5 != "DATA" && $5 != "ATTACH" { n++ } END { print n + 0 }' toc.txt)
          # rows.txt: "<rows> <schema.table>", one line per table with data.
          pg_restore --data-only --file=- dump.dump | awk '
            !copying && /^COPY / { copying = 1; table = $2; rows = 0; next }
            copying && $0 == "\\." { print rows, table; copying = 0; next }
            copying { rows++ }
          ' > rows.txt
          total=$(awk '{ n += $1 } END { print n + 0 }' rows.txt)
          # A reset re-applies the migrations, which refills these tables, so
          # they do not count towards min_rows.
          counted=$(awk '{ t = $2; sub(/^.*\./, "", t); gsub(/"/, "", t) }
            t !~ /^(_prisma_migrations|schema_migrations|migrations)$/ { n += $1 }
            END { print n + 0 }' rows.txt)
          echo "dump: $(wc -c < dump.dump | tr -d ' ') bytes, $tables tables, $total rows ($counted outside migration bookkeeping)"
          echo "::group::rows per table"
          sort -nr rows.txt
          echo "::endgroup::"
          if [ "$tables" -lt "$MIN_TABLES" ]; then
            echo "::error::Dump holds $tables tables, fewer than min_tables=$MIN_TABLES — refusing to upload it as a good backup"
            exit 1
          fi
          if [ "$counted" -lt "$MIN_ROWS" ]; then
            echo "::error::Dump holds $counted rows outside migration bookkeeping, fewer than min_rows=$MIN_ROWS — refusing to upload it as a good backup"
            exit 1
          fi
          echo "content guard passed"
        env:
          MIN_TABLES: ${{ inputs.min_tables }}
          MIN_ROWS: ${{ inputs.min_rows }}

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-db-${{ github.run_id }}
          path: dump.dump
          retention-days: ${{ inputs.retention_days }}
          # The dump is already compressed; zipping it again only costs time.
          compression-level: 0
          if-no-files-found: error

