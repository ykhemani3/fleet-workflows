# Reusable nightly pg_dump — one implementation for the whole fleet (D1).
# Callers keep their own cron schedule + secret; this file owns the HOW:
# version-matched client, compressed custom-format dump, content guard
# (tables + rows), integrity check, artifact upload, and an opt-in restore
# drill. Introduced by the 2026-08 fleet review (OPS-3/6).
# Every input except app_id has a default, so existing callers keep working.
name: DB Backup (reusable)

on:
  workflow_call:
    inputs:
      retention_days:
        description: Artifact retention in days (storage arithmetic in README)
        type: number
        default: 7
      app_id:
        description: Short app name used in the artifact name
        type: string
        required: true
      compression:
        description: pg_dump --compress spec for the custom-format dump
        type: string
        default: zstd:level=9,long
      min_tables:
        description: Fail when the dump holds fewer tables than this
        type: number
        default: 1
      min_rows:
        description: Fail when the dump holds fewer rows than this, not counting migration-bookkeeping tables
        type: number
        default: 1
      max_row_drop_pct:
        description: Fail when the rows min_rows counts fell by more than this percent since the last good backup; 100 turns the check off
        type: number
        default: 50
      check_schema:
        description: Count (and restore-drill) only this schema, e.g. public on Supabase; empty = every schema
        type: string
        default: ''
      restore_drill:
        description: Also restore the dump into a scratch postgres of the same major version and check its tables and rows
        type: boolean
        default: false
    secrets:
      DATABASE_URL_DIRECT:
        required: true

jobs:
  dump:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install version-matched postgres client
        run: |
          # apt-key is gone from apt >= 3.0 — use signed-by keyring.
          CODENAME=$(lsb_release -cs)
          sudo sh -c "echo \"deb http://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main\" > /etc/apt/sources.list.d/pgdg.list"
          wget -qO - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -yqq postgresql-client-17
          # The package does NOT go on PATH — /usr/bin/pg_dump stays the
          # runner's older client and pg_dump refuses on version mismatch.
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Dump
        run: |
          pg_dump --no-owner --no-privileges \
                  --format=custom \
                  --compress="$COMPRESSION" \
                  --file "dump.dump" \
                  "$DATABASE_URL_DIRECT"
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          COMPRESSION: ${{ inputs.compression }}

      # The last good backup's row count, for the guard's drop check. It sits
      # in the caller repo's Actions cache, which is not artifact storage.
      - name: Restore the last good row count
        uses: actions/cache/restore@v4
        with:
          path: rows-last-good.txt
          key: 'db-backup-rows:${{ inputs.app_id }}:${{ github.run_id }}-${{ github.run_attempt }}'
          restore-keys: 'db-backup-rows:${{ inputs.app_id }}:'

      # A wiped database still dumps to tens or hundreds of KB (its schema is
      # all still there), so size proves nothing: count what is inside instead.
      # Reading every COPY block also decompresses every data block — a far
      # stronger integrity check than listing the table of contents.
      - name: Content guard + integrity check
        run: |
          set -euo pipefail
          pg_restore --list dump.dump > toc.txt
          # rows.txt: "<rows>TAB<schema.table>" (named as in the COPY line), one
          # line per table with data.
          pg_restore --data-only --file=- dump.dump | awk '
            !copying && /^COPY / {
              copying = 1; rows = 0; table = substr($0, 6)
              sub(/ \(.*\) FROM stdin;$/, "", table); sub(/ +FROM stdin;$/, "", table)
              next
            }
            copying && $0 == "\\." { print rows "\t" table; copying = 0; next }
            copying { rows++ }
          ' > rows.txt
          # With check_schema set, only that schema's tables count (a Supabase
          # dump also carries auth, storage and the rest, which a wipe of public
          # leaves alone). tables.txt and rows-checked.txt feed the drill.
          awk -v s="$CHECK_SCHEMA" '$4 == "TABLE" && $5 != "DATA" && $5 != "ATTACH" && (s == "" || $5 == s) { n++ }
            END { print n + 0 }' toc.txt > tables.txt
          awk -F '\t' -v s="$CHECK_SCHEMA" 's == "" || index($2, s ".") == 1 || index($2, "\"" s "\".") == 1' \
            rows.txt > rows-checked.txt
          tables=$(cat tables.txt)
          total=$(awk -F '\t' '{ n += $1 } END { print n + 0 }' rows-checked.txt)
          # A reset re-applies the migrations, which refills these tables, so
          # they do not count towards min_rows. That alone does not catch a
          # reset: migrations and seed scripts put rows back in ordinary tables
          # too, so a reset database clears a low min_rows. The drop check
          # below, and min_rows set near the real count, catch it.
          counted=$(awk -F '\t' '{ t = $2; sub(/^.*\./, "", t); gsub(/"/, "", t) }
            t !~ /^(_prisma_migrations|schema_migrations|migrations)$/ { n += $1 }
            END { print n + 0 }' rows-checked.txt)
          echo "dump: $(wc -c < dump.dump | tr -d ' ') bytes, $tables tables, $total rows ($counted outside migration bookkeeping)${CHECK_SCHEMA:+ in schema $CHECK_SCHEMA}"
          echo "::group::rows per table"
          sort -nr rows-checked.txt
          echo "::endgroup::"
          if [ "$tables" -lt "$MIN_TABLES" ]; then
            echo "::error::Dump holds $tables tables, fewer than min_tables=$MIN_TABLES — refusing to upload it as a good backup"
            exit 1
          fi
          if [ "$counted" -lt "$MIN_ROWS" ]; then
            echo "::error::Dump holds $counted rows outside migration bookkeeping, fewer than min_rows=$MIN_ROWS — refusing to upload it as a good backup"
            exit 1
          fi
          # rows-last-good.txt: "<rows>TAB<check_schema>" from the last run that
          # passed. It moves only when the guard passes, so a wiped database
          # keeps failing night after night. A baseline counted over another
          # scope is ignored, and replaced below.
          last=$(awk -F '\t' -v s="$CHECK_SCHEMA" 'NR == 1 && $1 ~ /^[0-9]+$/ && $2 == s { print $1 }' rows-last-good.txt 2>/dev/null || true)
          if [ -n "$last" ]; then
            echo "last good backup: $last rows outside migration bookkeeping"
            if awk -v c="$counted" -v l="$last" -v p="$MAX_ROW_DROP_PCT" 'BEGIN { exit !(c * 100 < l * (100 - p)) }'; then
              echo "::error::Dump holds $counted rows outside migration bookkeeping, down more than max_row_drop_pct=$MAX_ROW_DROP_PCT% from $last at the last good backup — refusing to upload it as a good backup"
              exit 1
            fi
          else
            echo "no last good backup to compare with (first run, cache evicted, or check_schema changed)"
          fi
          printf '%s\t%s\n' "$counted" "$CHECK_SCHEMA" > rows-last-good.txt
          echo "content guard passed"
        env:
          MIN_TABLES: ${{ inputs.min_tables }}
          MIN_ROWS: ${{ inputs.min_rows }}
          MAX_ROW_DROP_PCT: ${{ inputs.max_row_drop_pct }}
          CHECK_SCHEMA: ${{ inputs.check_schema }}

      - name: Save this row count as the last good one
        uses: actions/cache/save@v4
        with:
          path: rows-last-good.txt
          key: 'db-backup-rows:${{ inputs.app_id }}:${{ github.run_id }}-${{ github.run_attempt }}'

      - name: Upload dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_id }}-db-${{ github.run_id }}
          path: dump.dump
          retention-days: ${{ inputs.retention_days }}
          # The dump is already compressed; zipping it again only costs time.
          compression-level: 0
          if-no-files-found: error

      # Restore drill (opt-in). It runs after the upload, so a failed drill
      # never costs the night's backup; it only turns the run red.
      - name: Start scratch postgres for the restore drill
        if: inputs.restore_drill
        run: |
          set -euo pipefail
          major=$(sed -n 's/^;[[:space:]]*Dumped from database version: \([0-9][0-9]*\).*/\1/p' toc.txt)
          if [ -z "$major" ]; then
            echo "::error::Cannot read the server's major version from the dump"
            exit 1
          fi
          docker run --detach --name drill-pg \
                     --env POSTGRES_HOST_AUTH_METHOD=trust \
                     --publish "127.0.0.1:$PGPORT:5432" "postgres:$major"
          for _ in $(seq 1 60); do
            if pg_isready --quiet; then echo "scratch postgres:$major is up"; exit 0; fi
            sleep 2
          done
          echo "::error::Scratch postgres:$major did not start"
          exit 1
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: postgres

      - name: Restore drill
        if: inputs.restore_drill
        run: |
          set -euo pipefail
          want_tables=$(cat tables.txt)
          if [ "$want_tables" -eq 0 ]; then
            echo "::error::The dump holds no tables to restore${CHECK_SCHEMA:+ in schema $CHECK_SCHEMA}"
            exit 1
          fi
          createdb "$DRILL_DB"
          schema_opt=""
          if [ -n "$CHECK_SCHEMA" ]; then
            schema_opt="--schema=$CHECK_SCHEMA"
            # pg_restore --schema restores the schema's objects, not the schema.
            echo 'create schema if not exists :"s";' | psql -X -q -v ON_ERROR_STOP=1 -v s="$CHECK_SCHEMA" -d "$DRILL_DB"
          fi
          rc=0
          pg_restore --no-owner --no-privileges ${schema_opt:+"$schema_opt"} --dbname="$DRILL_DB" dump.dump 2> restore.err || rc=$?
          if [ "$rc" -ne 0 ]; then
            errors=$(sed -n 's/.*errors ignored on restore: \([0-9][0-9]*\).*/\1/p' restore.err)
            if [ -z "$errors" ]; then
              cat restore.err
              echo "::error::pg_restore failed outright (exit $rc)"
              exit 1
            fi
            # Objects a vanilla postgres cannot create (a platform extension, a
            # role a policy names). Only each error's headline is printed: the
            # DETAIL line of a failed COPY can quote a row.
            echo "::warning::pg_restore reported $errors errors; the table and row checks below decide pass or fail"
            grep '^pg_restore: error:' restore.err | head -n 20 || true
          fi
          # Tables an extension creates are not in the dump's table count.
          got_tables=$(psql -X -At -v ON_ERROR_STOP=1 -d "$DRILL_DB" -c "
            select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where c.relkind in ('r', 'p') and n.nspname !~ '^pg_' and n.nspname <> 'information_schema'
              and not exists (select 1 from pg_depend d where d.classid = 'pg_class'::regclass
                              and d.objid = c.oid and d.deptype = 'e')")
          # Every table the dump holds rows for must hold at least as many
          # after the restore, compared table by table under the dump's names.
          psql -X -At -F "$(printf '\t')" -v ON_ERROR_STOP=1 -d "$DRILL_DB" -c "
            select format('%I.%I', n.nspname, c.relname),
                   (xpath('/row/n/text()', query_to_xml(
                     format('select count(*) as n from %I.%I', n.nspname, c.relname),
                     false, true, '')))[1]::text
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where c.relkind = 'r' and n.nspname !~ '^pg_' and n.nspname <> 'information_schema'" > restored.txt
          short=$(awk -F '\t' 'FILENAME == ARGV[1] { got[$1] = $2; next }
            !($2 in got) { print "  missing: " $2 " (" $1 " rows in the dump)"; next }
            got[$2] + 0 < $1 + 0 { print "  short: " $2 " has " got[$2] " of " $1 " rows" }' restored.txt rows-checked.txt)
          want_rows=$(awk -F '\t' '{ n += $1 } END { print n + 0 }' rows-checked.txt)
          got_rows=$(awk -F '\t' 'FILENAME == ARGV[1] { got[$1] = $2; next }
            { n += (got[$2] + 0 < $1 + 0 ? got[$2] + 0 : $1 + 0) } END { print n + 0 }' restored.txt rows-checked.txt)
          echo "restore drill: $got_tables of $want_tables tables, $got_rows of $want_rows rows"
          if [ "$got_tables" -lt "$want_tables" ]; then
            echo "::error::Restore drill: only $got_tables of the dump's $want_tables tables came back"
            exit 1
          fi
          if [ -n "$short" ]; then
            echo "$short"
            echo "::error::Restore drill: only $got_rows of the dump's $want_rows rows came back"
            exit 1
          fi
          echo "restore drill passed"
        env:
          PGHOST: 127.0.0.1
          PGPORT: 55432
          PGUSER: postgres
          DRILL_DB: drill
          CHECK_SCHEMA: ${{ inputs.check_schema }}
